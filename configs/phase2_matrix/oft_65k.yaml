# ============================================================================
# Phase 2 (OFT vs GR00T 공정 비교) — oft_65k
# ----------------------------------------------------------------------------
# 상태: 초안 (실행하지 않음). 클라우드 8×A100/H100 에서 scripts/phase2_launch.sh 로 실행.
# 기반: third_party/starVLA/examples/SimplerEnv/train_files/starvla_cotrain_oxe.yaml (공개 체크포인트 레시피)
# 통제 변수 (두 config 공통):
#   - 백본: StarVLA/Qwen3-VL-4B-Instruct-Action (고정)
#   - 데이터: data_mix=bridge_rt_1 (bridge + fractal), per_device_batch_size=16 × 8 GPU
#   - 학습률 그룹: qwen_vl_interface 1e-5 / action_model 1e-4 / base 1e-5, cosine_with_min_lr
#   - 정밀도: bf16 (starVLA/config/deepseeds/ds_config.yaml bf16.enabled=true + autocast bf16)
#   - 분산: accelerate + DeepSpeed ZeRO-2, --num_processes 8
#   - 시드: seed 0 / 1 (2 런)
# 이 config 의 변수: framework.name=QwenOFT, max_train_steps=65000, 중간 평가 20K/40K/65K
# 문서상 OFT 65K = 64.6. save_interval 5000 은 65K 가 20K 의 배수가 아니기 때문 (20K/40K/65K 외 체크포인트는 평가 후 삭제 가능).
# 평가: 각 중간 체크포인트를 로컬 4090 으로 가져와 `python3 scripts/run_ci.py --ckpt <steps_N_pytorch_model.pt>`
# ============================================================================
run_id: p2_oft_bridgert1_65k_s0
run_root_dir: results/Checkpoints
seed: 0                      # 시드 ≥2 요구: 두 번째 런은 --seed 1 로 오버라이드
wandb_entity: your_wandb_entity   # TODO: 실제 W&B entity
wandb_project: starvla-phase2-oft-vs-groot
is_debug: false
version_id: "0.21"

framework:
  name: QwenOFT
  qwenvl:
    base_vlm: playground/Pretrained_models/Qwen3-VL-4B-Instruct-Action   # StarVLA/Qwen3-VL-4B-Instruct-Action (HF) 를 이 경로에 다운로드
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  dino:
    dino_backbone: dinov2_vits14

  action_model:
    action_model_type: DiT-B
    hidden_size: 1024     # Matches the final DiT projection, used by the ActionDecoder
    add_pos_embed: True
    max_seq_len: 1024
    action_dim: 7
    state_dim: 7
    action_horizon: 16

    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:    # Parameters for the DiT transformer
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      positional_embeddings: null

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen2.5vl
    per_device_batch_size: 4

  vla_data:
    dataset_py: lerobot_datasets
    include_state: false
    data_root_dir: playground/Datasets/OXE_LEROBOT_DATASET   # bridge_orig_1.0.0_lerobot/, fractal20220817_data_0.1.0_lerobot/ (scripts/07_prepare_datasets.sh)
    data_mix: bridge_rt_1 # bridge_rt_1
    action_type: delta_ee
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    video_backend: torchvision_av
    
trainer:
  max_train_steps: 65000
  num_warmup_steps: 2000
  save_interval: 5000          # 중간 평가 지점 20K/40K/65K 의 체크포인트가 반드시 남도록 설정
  eval_interval: 1000
  learning_rate:
    base: 1e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  # pretrained_checkpoint: ./results/Checkpoints/1_need/0601_qwenact_fixqwen_32gpus_lr_1e-3_qformer_36_37/steps_100000/pytorch_model.pt
  # reload_modules: 'action_model,layer_qformer' # warning: this may cause model to not converge
  # repeated_diffusion_steps moved to framework.action_model.repeated_diffusion_steps
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
